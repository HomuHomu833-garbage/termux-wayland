name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'

permissions:
  contents: write
  
jobs:
  # Xwayland with glamor (tools/build-xwayland.sh), packaged as termux-wayland-xwayland: built in
  # Termux itself (its aarch64 Docker image, on an arm64 runner: no emulation).
  xwayland:
    name: "Xwayland (glamor)"
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1

    - name: Build and package
      run: |
        mkdir -m 777 out
        docker run --rm --privileged -e GITHUB_SHA -v "$PWD/tools:/tools:ro" -v "$PWD/out:/out" \
          termux/termux-docker:aarch64 bash -c '
            set -e
            yes | pkg upgrade -y >/dev/null
            bash /tools/build-xwayland.sh
            bash /tools/package-xwayland.sh /out "$(date +%Y%m%d).${GITHUB_SHA::7}"'
        ls -l out

    - name: Store Xwayland package
      uses: actions/upload-artifact@v7
      with:
        name: termux-wayland-xwayland
        path: ./out/termux-wayland-xwayland_*.deb

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: xwayland
    # The app still builds and ships when Xwayland fails.
    if: ${{ !cancelled() }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - name: Validation
      uses: gradle/actions/wrapper-validation@v6.4.0

    - name: Java setup
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1

    - name: Build
      run: ./gradlew assembleDebug
    - name: Store app-universal-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-wayland-universal-debug
        path: ./lorie-app/build/outputs/apk/standalone/debug/termux-wayland-universal-debug.apk

    - name: Store sharedUid-debug APK
      uses: actions/upload-artifact@v7
      with:
        name: termux-wayland-sharedUid-debug
        path: ./lorie-app/build/outputs/apk/sharedUid/debug/termux-wayland-universal-sharedUid-debug.apk

    - name: Store companion package
      uses: actions/upload-artifact@v7
      with:
        name: termux-companion-packages
        path: |
          ./shell-loader/build/outputs/companion/termux-wayland-nightly-*-all.deb
          ./shell-loader/build/outputs/companion/termux-x11-nightly-*-all.deb

    - name: Store unstripped libraries with debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: termux-wayland-unstripped-libraries-for-ndk-stack
        path: ./lorie/build/intermediates/cxx/Debug/*

    - name: Fetch Xwayland package
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: termux-wayland-xwayland
        path: ./xwayland-deb

    - name: Update Nightly Release
      uses: andelf/nightly-release@main
      if: github.repository == 'HomuHomu833/termux-wayland' && github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nightly
        name: 'Nightly Release $$'
        draft: false
        prerelease: false
        body: |
          This is a nightly release of the termux-wayland app.
          Based on ${{ github.sha }}
        files: |
          ./lorie-app/build/outputs/apk/standalone/debug/termux-wayland-universal-debug.apk
          ./lorie-app/build/outputs/apk/sharedUid/debug/termux-wayland-universal-sharedUid-debug.apk
          ./shell-loader/build/outputs/companion/termux-wayland-nightly-*-all.deb
          ./shell-loader/build/outputs/companion/termux-x11-nightly-*-all.deb
          ./xwayland-deb/termux-wayland-xwayland_*.deb
