// Builds the companion .deb packages for Termux:
//  - termux-wayland-nightly: termux-wayland, termux-wayland-preference, termux-wayland-x11 and the
//    loader apk.
//  - termux-x11-nightly: termux-x11 and termux-x11-preference running on Termux:Wayland (Xwayland),
//    for scripts written for Termux:X11. Its version has an epoch so that Termux:X11's own package
//    in x11-repo does not replace it on `pkg upgrade`.

buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'org.apache.commons:commons-compress:1.26.2'
        classpath 'org.tukaani:xz:1.9'
    }
}

import org.apache.commons.compress.archivers.ar.ArArchiveEntry
import org.apache.commons.compress.archivers.ar.ArArchiveOutputStream
import org.apache.commons.compress.archivers.tar.TarArchiveEntry
import org.apache.commons.compress.archivers.tar.TarArchiveOutputStream
import org.apache.commons.compress.compressors.gzip.GzipCompressorOutputStream
import org.apache.commons.compress.compressors.xz.XZCompressorOutputStream
import org.apache.tools.ant.filters.ReplaceTokens

def version = (file("$rootDir/lorie/version.gradle").text =~ /version = "([^"]+)"/)[0][1] + '-0'
def homepage = 'https://github.com/HomuHomu833/termux-wayland'
def maintainer = 'Homura @HomuHomu833'
def outputDir = layout.buildDirectory.dir('outputs/companion').get().asFile

def packages = [
    [name: 'termux-wayland-nightly', version: version, depends: 'bash',
     description: 'Companion package for the Termux:Wayland app',
     scripts: ['termux-wayland', 'termux-wayland-preference', 'termux-wayland-x11'], loader: true],
    [name: 'termux-x11-nightly', version: "1:$version", depends: "termux-wayland-nightly (= $version), xwayland, bash",
     description: 'termux-x11 and termux-x11-preference running on Termux:Wayland through Xwayland',
     scripts: ['termux-x11', 'termux-x11-preference'], loader: false],
]

tasks.register('generateWrapperScripts', Copy) {
    from 'scripts'
    include '*.in'
    rename { it - '.in' }
    into layout.buildDirectory.dir('generated/scripts')
    filter(ReplaceTokens, tokens: [APPLICATION_ID: targetApplicationId, EMBEDDED_APPLICATION_ID: embeddedApplicationId])
    filePermissions { unix(0755) }
}

tasks.register('buildCompanionPackage') {
    dependsOn tasks.named('assembleDebug'), tasks.named('generateWrapperScripts')

    def loaderApk = layout.buildDirectory.file('outputs/apk/debug/shell-loader-debug.apk')
    def scriptsDir = layout.buildDirectory.dir('generated/scripts')
    inputs.file(loaderApk)
    inputs.dir(scriptsDir)
    outputs.files(packages.collect { new File(outputDir, "${it.name}-${it.version.replace(':', '_')}-all.deb") })

    doLast {
        // Fixed identity for every entry, so the archives do not depend on the builder's umask.
        int uid = 1000, gid = 1000, dirMode = 040755, execMode = 0100755, fileMode = 0100644
        int time = (System.currentTimeMillis() / 1000L) as int
        def prefix = "data/data/$embeddedApplicationId/files/usr".toString()
        def chmodLoader = "chmod 400 /$prefix/libexec/termux-wayland/loader.apk"

        def addEntry = { tar, String name, byte[] data, int mode ->
            tar.putArchiveEntry(new TarArchiveEntry(data == null ? "$name/" : name).tap {
                it.mode = mode; it.userId = uid; it.groupId = gid
                it.modTime = new Date(time * 1000L); it.size = data == null ? 0 : data.length
            })
            if (data != null)
                tar.write(data)
            tar.closeArchiveEntry()
        }

        outputDir.mkdirs()
        packages.each { pkg ->
            def scripts = pkg.scripts.collectEntries {
                ["$prefix/bin/$it".toString(), file("${scriptsDir.get()}/$it").bytes]
            }
            def content = scripts.clone()
            if (pkg.loader)
                content[("$prefix/libexec/termux-wayland/loader.apk".toString())] = loaderApk.get().asFile.bytes
            // Every file plus the directories leading to it; sorting the whole set puts each directory
            // right before its contents, which is the order dpkg expects.
            def paths = content.keySet().collectMany { path ->
                def parts = path.split('/')
                (1..parts.size()).collect { parts[0..<it].join('/') }
            }.unique().sort()
            def modeOf = { String path -> content[path] == null ? dirMode : (path in scripts.keySet() ? execMode : fileMode) }

            def controlText = """Package: ${pkg.name}
Architecture: all
Maintainer: $maintainer
Version: ${pkg.version}
Homepage: $homepage
Depends: ${pkg.depends}
Description: ${pkg.description}
"""
            def controlTarGz = new ByteArrayOutputStream()
            new TarArchiveOutputStream(new GzipCompressorOutputStream(controlTarGz)).withCloseable { tar ->
                addEntry(tar, '.', null, dirMode)
                addEntry(tar, './control', controlText.bytes, fileMode)
                if (pkg.loader)
                    addEntry(tar, './postinst', "#!/$prefix/bin/sh\n$chmodLoader\n".bytes, execMode)
                tar.finish()
            }

            def dataTarXz = new ByteArrayOutputStream()
            new TarArchiveOutputStream(new XZCompressorOutputStream(dataTarXz)).withCloseable { tar ->
                addEntry(tar, '.', null, dirMode)
                paths.each { addEntry(tar, "./$it", content[it], modeOf(it)) }
                tar.finish()
            }

            def debFile = new File(outputDir, "${pkg.name}-${pkg.version.replace(':', '_')}-all.deb")
            new ArArchiveOutputStream(new FileOutputStream(debFile)).withCloseable { ar ->
                ['debian-binary': '2.0\n'.bytes, 'control.tar.gz': controlTarGz.toByteArray(),
                 'data.tar.xz'  : dataTarXz.toByteArray()].each { name, data ->
                    ar.putArchiveEntry(new ArArchiveEntry(name, data.length, uid, gid, fileMode, time))
                    ar.write(data)
                    ar.closeArchiveEntry()
                }
                ar.finish()
            }
        }
    }
}
